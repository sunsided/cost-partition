[package]
name = "cost-partition"
description = "Cost partitioning (saturated, max-over-orders) over arbitrary planning abstractions"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/sunsided/cost-partition"
readme = "README.md"
keywords = ["planning", "cost-partitioning", "heuristic", "abstraction", "fast-downward"]
categories = ["algorithms", "science", "no-std"]
# GPL-2.0 test inputs; see tests/fixtures/README.md
exclude = ["tests/fixtures"]

[dependencies]
sas-plus = { version = "0.2.0", default-features = false }

[dev-dependencies]
criterion = "0.7.0"
proptest = "1.11.0"
sas-plus = { version = "0.2.0", features = ["fdr", "random"] }

[[bench]]
name = "scp"
harness = false
