[package]
name = "cost-partition"
description = "Saturated cost partitioning and its maximum over orders for admissible planning heuristics over arbitrary abstractions"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/sunsided/cost-partition"
homepage = "https://sunsided.github.io/planning-and-search/crates/cost-partition/"
readme = "README.md"
keywords = ["planning", "cost-partitioning", "heuristic", "abstraction", "pattern-database"]
categories = ["algorithms", "artificial-intelligence", "science", "no-std"]
# Only what the library and the README doctest need. The tests, benches and
# examples read the GPL-2.0-or-later fixtures in tests/fixtures/translated,
# which stay out of the package (see tests/fixtures/README.md).
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSES/Apache-2.0.txt",
    "/LICENSES/MIT.txt",
    "/tests/fixtures/gripper-costs",
]

[dependencies]
sas-plus = { version = "0.2.0", default-features = false }

[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[dev-dependencies]
criterion = "0.8.2"
merge-and-shrink = "0.3"
proptest = "1.11.0"
sas-plus = { version = "0.2.0", features = ["fdr", "random"] }

[[bench]]
name = "scp"
harness = false
